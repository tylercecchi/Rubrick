[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubrick"
version = "0.1.0"
description = "Compile a designed product's system from its source; coding agents build new work that provably conforms to it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Tyler Cecchi" }]
keywords = ["product-system", "design", "conformance", "mcp", "llm", "agents"]

dependencies = [
  "anthropic>=0.116",
  # <2: mcp 2.x renamed FastMCP -> MCPServer (breaking); rubrick_mcp is written against the 1.x API.
  "mcp>=1.28,<2",
  "pydantic>=2.13",
  "pydantic-settings>=2.14",
  # the API key entered in the app is kept in the OS keychain (macOS Keychain, Windows
  # Credential Locker, Secret Service), never on a command line
  "keyring>=25",
  # Intel Macs: cryptography 49+ ships prebuilt wheels for Apple Silicon only, and building
  # it from source needs Rust + OpenSSL headers (it arrives via mcp -> pyjwt[crypto]).
  # 48.0.1 is the last release with an Intel build (universal2, macOS 10.9+).
  "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# Probes, trial harness, and the eval regression guard — not shipped in a runtime install.
dev = []

[project.scripts]
# The primary interface: launch the MCP server (get_product_system / check_conformance /
# compile_product_system / apply_review). Register this command with an MCP client.
rubrick-mcp = "rubrick.rubrick_mcp:main"
# The local app and CLI: `rubrick ui` opens the review/toggle app in a browser.
rubrick = "rubrick.cli:main"

# The core library is the `rubrick` package under src/. The dev layer (probes/, eval_harness.py)
# and runtime data (systems/, learned.json, .cache/ — resolved via rubrick.paths / RUBRICK_HOME)
# are intentionally NOT part of the distribution.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the local app's page ships inside the package
rubrick = ["ui/*.html", "ui/stage/*.js", "ui/stage/*.css",
           # vendored Stageshow: the docs the drawing prompts are built from, and the film tools
           "stageshow/*.md", "stageshow/LICENSE", "stageshow/package.json",
           "stageshow/references/*", "stageshow/scripts/*", "stageshow/examples/**/*", "stageshow/kit/**/*"]
